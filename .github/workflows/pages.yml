# Publica web/ en GitHub Pages (gratis). Activar una vez: Settings -> Pages -> Source: GitHub Actions.
# Antes, poner la URL del Worker en web/src/modules/input/config.js (GUTENBERG_PROXY).
name: pages
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  desplegar:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.pages.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with: { path: web }
      - id: pages
        uses: actions/deploy-pages@v4
